# ======================================================
# Applications
# ======================================================

# Terminal
bind = SUPER, T, exec, kitty

# App Launcher (Wofi)
bind = SUPER, R, exec, ~/.config/hypr/scripts/launcher.py
# gravacion
bind = SUPER ALT, G, exec, obs
# Impr Pant → Guarda la pantalla completa
bind = , Print, exec, mkdir -p /home/lol/Imágenes/Screenshots && grim /home/lol/Imágenes/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png

# Shift + Impr Pant → Selecciona un área y la copia al portapapeles
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy
# ======================================================
# Grupos
# ======================================================
# Crear/destruir grupo
bind = SUPER, G, togglegroup
# Cambiar entre ventanas del grupo
bind = SUPER, Tab, changegroupactive, f
bind = SUPER SHIFT, Tab, changegroupactive, b
# Mover ventana al grupo
bind = SUPER CTRL, G, movewindoworgroup, l
# Bloquear grupo
bind = SUPER ALT, G, lockgroups, toggle
# catura de pantalla
bind = , Print, exec, bash ~/.config/hypr/scripts/screenshot.sh
# Waybar
bind = SUPER, B, exec, pkill waybar || waybar -c ~/.config/hypr/waybar/config.jsonc -s ~/.config/hypr/waybar/style.css
# ======================================================
# Windows
# ======================================================
# Cerrar ventana
bind = SUPER, Q, killactive
# Pantalla completa
bind = SUPER, F, fullscreen
# Ventana flotante
bind = SUPER, SPACE, togglefloating
# Centrar ventana flotante
bind = SUPER, C, centerwindow
# Cambiar foco
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
# Mover ventana
bind = SUPER CTRL, left, movewindow, l
bind = SUPER CTRL, right, movewindow, r
bind = SUPER CTRL, up, movewindow, u
bind = SUPER CTRL, down, movewindow, d
# Redimensionar
bind = SUPER SHIFT, left, resizeactive, -50 0
bind = SUPER SHIFT, right, resizeactive, 50 0
bind = SUPER SHIFT, up, resizeactive, 0 -50
bind = SUPER SHIFT, down, resizeactive, 0 50
# Mover ventana flotante con mouse
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
# Cambiar entre ventanas
bind = ALT, Tab, cyclenext
bind = ALT SHIFT, Tab, cyclenext, prev
# Minimizar / ocultar ventana
bind = SUPER, H, movetoworkspacesilent, special:minimized
bind = SUPER SHIFT, H, togglespecialworkspace, minimized
# Pin ventana flotante (siempre visible)
bind = SUPER, P, pin
# Swap ventanas
bind = SUPER SHIFT, S, swapnext
# Workspaces

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Mover ventana

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10
# Scroll entre workspaces con rueda del mouse
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Workspace anterior/siguiente
bind = SUPER, bracketright, workspace, e+1
bind = SUPER, bracketleft, workspace, e-1

# Mover ventana y seguirla al workspace
bind = SUPER CTRL SHIFT, 1, movetoworkspacesilent, 1
bind = SUPER CTRL SHIFT, 2, movetoworkspacesilent, 2
bind = SUPER CTRL SHIFT, 3, movetoworkspacesilent, 3
bind = SUPER CTRL SHIFT, 4, movetoworkspacesilent, 4
bind = SUPER CTRL SHIFT, 5, movetoworkspacesilent, 5

# Workspace especial (scratchpad)
bind = SUPER, grave, togglespecialworkspace, magic
bind = SUPER SHIFT, grave, movetoworkspace, special:magic

# Ir al workspace anterior
bind = SUPER, Tab, workspace, previous